name: 'LLM Code Agent'
author: Peter Hindes (@PeterHindes)
description: 'A Github Action that posts code review from OpenAI to pull request'
inputs:
  github-token:
    description: 'The token used to authenticate with the GitHub API'
    required: false
    default: ${{ github.token }}
  model:
    description: 'The OpenAI language model to use for code review'
    required: false
    default: 'gpt-3.5-turbo'
  openai-key:
    description: 'The OpenAI API key'
    required: true
  openai-baseurl:
    description: 'The base_url for the openai api'
    required: false
    default: 'https://api.openai.com/'
  prompt:
    description: 'The prompt to use for the analysis.'
    required: True
  file-types:
    description: 'The file types to include in the prompt'
    required: true
  holding-path:
    description: 'The path to the holding folder containing the tests and current code'
    required: true

outputs:
  results:
    description: 'The results of the code review'
    value: ${{ steps.openai.outputs.response }}

runs:
  using: 'composite'
  steps:
    - name: CD to holding path
      run: cd ${{ github.action_path }}
      shell: bash

    - name: Install Go
      uses: actions/setup-go@v2
      with:
        go-version: '1.22.2'
      shell: bash
    
    - name: Install Dependencies From go.mod
      run: go mod download
      shell: bash

    - name: Run OpenAI code review
      id: openai
      run: |
        echo 'response<<EOF' >> $GITHUB_OUTPUT
        go run main.go >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-key }}
        OPENAI_API_BASEURL: ${{ inputs.openai-baseurl }}
        MODEL: ${{ inputs.model }}
        PROMPT: ${{ inputs.prompt }}
        FILE_TYPES: ${{ inputs.file-types }}
        HOLDING_PATH: ${{ inputs.holding-path }}

branding:
  icon: 'user-check'
  color: 'green'
